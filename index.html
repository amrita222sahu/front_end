<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#7b6ff0;
    }

    .calculator{
      background:#1f1f3d;
      padding:20px;
      border-radius:25px;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
      width:320px;
    }

    .display{
      width:100%;
      height:80px;
      background:#0d0d1f;
      border:none;
      border-radius:15px;
      margin-bottom:20px;
      color:white;
      font-size:35px;
      text-align:right;
      padding:20px;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    button{
      height:70px;
      border:none;
      border-radius:15px;
      font-size:28px;
      cursor:pointer;
      color:white;
      background:#2f2f50;
    }

    button:hover{
      opacity:0.8;
    }

    .pink{
      background:#ff4d6d;
    }

    .orange{
      background:#ff9800;
    }

    .green{
      background:#2ecc71;
    }

    .zero{
      grid-column:span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <input type="text" class="display" id="display" value="0" readonly>

    <div class="buttons">

      <button class="pink" onclick="clearDisplay()">AC</button>
      <button class="pink" onclick="deleteLast()">DEL</button>
      <button class="orange" onclick="append('%')">%</button>
      <button class="orange" onclick="append('/')">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="orange" onclick="append('*')">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="orange" onclick="append('-')">−</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="orange" onclick="append('+')">+</button>

      <button class="zero" onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="green" onclick="calculate()">=</button>

    </div>

  </div>

<script>

  let display = document.getElementById("display");

  function append(value){
    if(display.value === "0"){
      display.value = value;
    }else{
      display.value += value;
    }
  }

  function clearDisplay(){
    display.value = "0";
  }

  function deleteLast(){
    display.value = display.value.slice(0,-1);

    if(display.value === ""){
      display.value = "0";
    }
  }

  function calculate(){
    try{
      display.value = eval(display.value);
    }
    catch{
      display.value = "Error";
    }
  }

</script>

</body>
</html>
